spring.application.name=certiflow
server.port=8080

# Embedded file database; override with SPRING_DATASOURCE_URL for another one.
spring.datasource.url=jdbc:h2:file:./data/certiflow
spring.datasource.username=sa
spring.datasource.password=

# Flyway is run by JdbcPersistence itself; the schema belongs to the infrastructure module.
spring.flyway.enabled=false

# Zone used to decide what "today" means for due dates and expiries.
certiflow.zone=America/Argentina/Buenos_Aires

# Where overdue corrective actions are announced. Empty = write them to the log.
certiflow.notifications.webhook-url=
certiflow.notifications.timeout-seconds=3

# Inspection assistant. Off until consultations are persisted (ConsultationRepository and
# BrowseConsultations beans).
# provider: none (every consultation answers 503) or openai-compatible, which needs base-url and model,
# for example https://api.openai.com/v1 or http://localhost:11434/v1 for Ollama. The key, when the
# provider needs one, goes in the CERTIFLOW_ASSISTANT_API_KEY environment variable, never in this file.
certiflow.assistant.enabled=false
certiflow.assistant.provider=none
certiflow.assistant.base-url=
certiflow.assistant.model=
certiflow.assistant.prompt=suggest-findings/v1
certiflow.assistant.timeout-seconds=60
