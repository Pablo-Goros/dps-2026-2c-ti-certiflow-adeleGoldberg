spring.application.name=certiflow
server.port=8080

# Embedded file database; override with SPRING_DATASOURCE_URL for another one.
spring.datasource.url=jdbc:h2:file:./data/certiflow
spring.datasource.username=sa
spring.datasource.password=

# Flyway is run by JdbcPersistence itself; the schema belongs to the infrastructure module.
spring.flyway.enabled=false

# Zone used to decide what "today" means for due dates and expiries.
certiflow.zone=America/Argentina/Buenos_Aires
